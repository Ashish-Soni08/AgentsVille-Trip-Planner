[project]
name = "agentsville-trip-planner"
version = "0.1.0"
description = "A Jupyter Notebook AI travel assistant for planning fictional AgentsVille trips."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "json-repair==0.47.1",
    "jupyterlab>=4.3.0",
    "numexpr==2.11.0",
    "openai==1.74.0",
    "pandas==2.3.0",
    "pydantic==2.11.7",
    "python-dotenv==1.1.0",
]

[tool.uv]
package = false
